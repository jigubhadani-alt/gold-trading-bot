name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir project
          unzip -q gold-trading-bot.zip -d project

          if [ -f project/settings.gradle.kts ]; then
            echo "PROJECT_DIR=project" >> "$GITHUB_ENV"
          else
            DIR=$(find project -name settings.gradle.kts -printf '%h\n' | head -1)
            echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gold-trading-bot-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
